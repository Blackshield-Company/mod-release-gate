name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a synthetic fixture mod
        run: python3 -c "import sys; sys.path.insert(0, 'tests'); from fixtures import make_mod; make_mod('fixture-mod')"
      - id: gate
        uses: ./
        with:
          game: skyrimse
          path: fixture-mod
          tag: v1.2.0
          esl: require
          mod-conflict-graph-source: ''
      - run: test "${{ steps.gate.outputs.result }}" = pass
